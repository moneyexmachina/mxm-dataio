[tool.poetry]
name = "mxm-dataio"
version = "0.4.2"
description = "**Unified ingestion, caching, and audit layer for Money Ex Machina.**"
authors = ["mxm <contact@moneyexmachina.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "mxm", from = "src" }]
include = [
  { path = "LICENSE" },
  { path = "src/mxm/dataio/py.typed", format = "wheel" },
  { path = "src/mxm/dataio/_data/seeds/**/*.yaml", format = "wheel" },
]

classifiers = ["Typing :: Typed"]

[tool.poetry.dependencies]
python = ">=3.13, <3.15"
mxm-config = ">=0.5.2" 
mxm-types = ">=0.2.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
isort = "^6.0.1"
black = "^25.9.0"
ruff = "^0.13.2"
pytest = "^8.4.2"
ipython = "^9.6.0"
pyright = "^1.1.406"


# ---- Tooling (package-local, MXM defaults) ----
[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["mxm"]
combine_as_imports = true

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E","F","I","B","UP","C90","RUF"]
ignore = ["E203","E501"]

[tool.ruff.lint.isort]
known-first-party = ["mxm"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
